<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" font-family="Helvetica,Arial,sans-serif" font-size="13">
  <!-- background -->
  <rect width="820" height="580" fill="#ffffff"/>

  <!-- Atmosphere -->
  <rect x="40" y="20" width="320" height="80" fill="#f7faff" stroke="#cdd9e6"/>
  <text x="200" y="42" text-anchor="middle" fill="#345" font-size="14" font-weight="bold">Atmosphere</text>

  <!-- Surface flux arrows (three, spread out, with labels above) -->
  <defs>
    <marker id="redarrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/>
    </marker>
    <marker id="greenarrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#27ae60"/>
    </marker>
    <marker id="orangearrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e67e22"/>
    </marker>
  </defs>

  <!-- Q_SW (downward, penetrating) -->
  <g stroke="#c0392b" stroke-width="2" fill="#c0392b">
    <text x="100" y="62" text-anchor="middle" fill="#c0392b" font-size="11" font-weight="bold">Q_SW</text>
    <text x="100" y="76" text-anchor="middle" fill="#c0392b" font-size="10" font-weight="normal">shortwave ↓</text>
    <line x1="100" y1="84" x2="100" y2="118" marker-end="url(#redarrow)"/>
  </g>
  <!-- Q_LW (net upward typically) -->
  <g stroke="#c0392b" stroke-width="2" fill="#c0392b">
    <text x="200" y="62" text-anchor="middle" fill="#c0392b" font-size="11" font-weight="bold">Q_LW</text>
    <text x="200" y="76" text-anchor="middle" fill="#c0392b" font-size="10" font-weight="normal">longwave ↑</text>
    <line x1="200" y1="118" x2="200" y2="84" marker-end="url(#redarrow)"/>
  </g>
  <!-- Q_lat + Q_sens (upward, latent+sensible) -->
  <g stroke="#c0392b" stroke-width="2" fill="#c0392b">
    <text x="300" y="62" text-anchor="middle" fill="#c0392b" font-size="11" font-weight="bold">Q_lat, Q_sens</text>
    <text x="300" y="76" text-anchor="middle" fill="#c0392b" font-size="10" font-weight="normal">evap. + sensible ↑</text>
    <line x1="300" y1="118" x2="300" y2="84" marker-end="url(#redarrow)"/>
  </g>

  <!-- Water column -->
  <defs>
    <linearGradient id="watergrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcecf8"/>
      <stop offset="35%" stop-color="#9ec3df"/>
      <stop offset="70%" stop-color="#4575a8"/>
      <stop offset="100%" stop-color="#1b3956"/>
    </linearGradient>
  </defs>
  <rect x="40" y="120" width="320" height="380" fill="url(#watergrad)" stroke="#2b486b"/>

  <!-- Beer-Lambert decay curve inside the column, near the left, going down -->
  <path d="M 100 122 Q 105 200 95 320" stroke="#e67e22" stroke-width="2.2" stroke-dasharray="6 4" fill="none" marker-end="url(#orangearrow)"/>
  <rect x="55" y="270" width="80" height="32" fill="#fff8ec" stroke="#e67e22" opacity="0.95"/>
  <text x="95" y="282" text-anchor="middle" fill="#b25800" font-size="10" font-weight="bold">Beer–Lambert</text>
  <text x="95" y="295" text-anchor="middle" fill="#b25800" font-size="10">decay S(z, t)</text>

  <!-- Deep reservoir band -->
  <rect x="40" y="500" width="320" height="40" fill="#0e2236" stroke="#2b486b"/>
  <text x="200" y="525" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Deep reservoir: T(−H, t) = T_deep</text>

  <!-- Mooring chain (vertical dashed line) -->
  <line x1="170" y1="120" x2="170" y2="500" stroke="#fff" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Sensors with white-background labels -->
  <g font-size="11">
    <circle cx="170" cy="155" r="6" fill="#f4d03f" stroke="#333"/>
    <rect x="182" y="146" width="125" height="18" fill="#ffffff" stroke="#caa436" opacity="0.95"/>
    <text x="244" y="159" text-anchor="middle" fill="#222">T(z₁, t) — z₁ = 5 m</text>

    <circle cx="170" cy="210" r="6" fill="#f4d03f" stroke="#333"/>
    <rect x="182" y="201" width="125" height="18" fill="#ffffff" stroke="#caa436" opacity="0.95"/>
    <text x="244" y="214" text-anchor="middle" fill="#222">T(z₂, t) — z₂ = 20 m</text>

    <circle cx="170" cy="285" r="6" fill="#f4d03f" stroke="#333"/>
    <rect x="182" y="276" width="125" height="18" fill="#ffffff" stroke="#caa436" opacity="0.95"/>
    <text x="244" y="289" text-anchor="middle" fill="#222">T(z₃, t) — z₃ = 40 m</text>

    <circle cx="170" cy="370" r="6" fill="#f4d03f" stroke="#333"/>
    <rect x="182" y="361" width="125" height="18" fill="#ffffff" stroke="#caa436" opacity="0.95"/>
    <text x="244" y="374" text-anchor="middle" fill="#222">T(z₄, t) — z₄ = 70 m</text>

    <circle cx="170" cy="460" r="6" fill="#f4d03f" stroke="#333"/>
    <rect x="182" y="451" width="125" height="18" fill="#ffffff" stroke="#caa436" opacity="0.95"/>
    <text x="244" y="464" text-anchor="middle" fill="#222">T(z₅, t) — z₅ = 95 m</text>
  </g>

  <!-- Thermocline marker -->
  <line x1="40" y1="240" x2="360" y2="240" stroke="#ffe066" stroke-width="1" stroke-dasharray="2 4"/>
  <rect x="44" y="226" width="86" height="14" fill="#ffe066" opacity="0.9"/>
  <text x="48" y="237" fill="#20242c" font-size="10" font-weight="bold">— thermocline —</text>

  <!-- Vertical advection arrow (RIGHT of the column, doesn't collide with sensors) -->
  <g stroke="#27ae60" stroke-width="3" fill="#27ae60">
    <line x1="345" y1="475" x2="345" y2="160" marker-end="url(#greenarrow)"/>
  </g>
  <rect x="316" y="280" width="42" height="42" fill="#eef7ee" stroke="#27ae60" opacity="0.95"/>
  <text x="337" y="294" text-anchor="middle" fill="#1d6e3a" font-size="11" font-weight="bold">w(z, t)</text>
  <text x="337" y="307" text-anchor="middle" fill="#1d6e3a" font-size="9">vertical</text>
  <text x="337" y="317" text-anchor="middle" fill="#1d6e3a" font-size="9">advection</text>

  <!-- Eddy diffusivity κ — vertical text label on left, OUTSIDE the column -->
  <text x="22" y="310" fill="#7e3aae" font-size="11" font-weight="bold" transform="rotate(-90 22 310)" text-anchor="middle">
    κ(z, t)  —  eddy / turbulent diffusivity
  </text>

  <!-- Depth axis (left of the column, with z = 0 and z = -H labels) -->
  <g stroke="#222" stroke-width="1.4" fill="#222">
    <line x1="40" y1="120" x2="40" y2="500"/>
    <text x="28" y="124" text-anchor="end" font-size="11" font-weight="bold">z = 0</text>
    <text x="28" y="504" text-anchor="end" font-size="11" font-weight="bold">z = −H</text>
  </g>

  <!-- Right-hand annotated panels -->
  <g font-size="12" fill="#222">
    <rect x="395" y="35" width="395" height="135" fill="#fbf7e7" stroke="#caa436"/>
    <text x="405" y="55" font-weight="bold">Column PDE in (z, t)</text>
    <text x="405" y="80">∂T/∂t = −w(z, t) ∂T/∂z</text>
    <text x="405" y="100">       + ∂/∂z [ κ(z, t) ∂T/∂z ]</text>
    <text x="405" y="120">       + S(z, t)          (penetrating SW)</text>
    <text x="405" y="148" fill="#888" font-size="11" font-style="italic">advection + Fickian diffusion + body source</text>

    <rect x="395" y="195" width="395" height="120" fill="#eef7ee" stroke="#3e8e41"/>
    <text x="405" y="215" font-weight="bold">Boundary conditions</text>
    <text x="405" y="240">surface (z = 0):  ρ c_p κ ∂T/∂z = Q_np(t)</text>
    <text x="405" y="262">deep  (z = −H):  T = T_deep</text>
    <text x="405" y="290" fill="#888" font-size="11" font-style="italic">Neumann at top (air-sea flux),</text>
    <text x="405" y="304" fill="#888" font-size="11" font-style="italic">Dirichlet at bottom (deep reservoir).</text>

    <rect x="395" y="340" width="395" height="160" fill="#f3eef8" stroke="#7e57c2"/>
    <text x="405" y="360" font-weight="bold">Prescribed forcings (from elsewhere)</text>
    <text x="405" y="385">w(z, t):       2-D shallow-water + continuity</text>
    <text x="405" y="408">κ(z, t):       KPP / Mellor–Yamada closure</text>
    <text x="405" y="431">Q_np(t):      bulk air-sea formulas</text>
    <text x="405" y="454">Q_SW(t):     observed insolation</text>
    <text x="405" y="482" fill="#888" font-size="11" font-style="italic">column inherits these — does not solve for them.</text>
  </g>

  <!-- Footer caption -->
  <text x="410" y="558" text-anchor="middle" fill="#444" font-size="11">
    Schematic of the 1-D thermistor column (Unit 8 §8.2). Five sensors at fixed depths sample T(z_k, t) as the column evolves
  </text>
  <text x="410" y="572" text-anchor="middle" fill="#444" font-size="11">
    under vertical advection by w, turbulent diffusion by κ, surface fluxes (red), and penetrating shortwave (orange, dashed).
  </text>
</svg>
