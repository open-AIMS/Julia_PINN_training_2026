<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="Helvetica,Arial,sans-serif" font-size="13">
  <!-- background -->
  <rect width="720" height="540" fill="#ffffff"/>

  <!-- Sky -->
  <rect x="40" y="20" width="320" height="60" fill="#f7faff" stroke="#cdd9e6"/>
  <text x="200" y="55" text-anchor="middle" fill="#345" font-size="14">Atmosphere</text>

  <!-- Water column (background) -->
  <defs>
    <linearGradient id="watergrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcecf8"/>
      <stop offset="35%" stop-color="#9ec3df"/>
      <stop offset="70%" stop-color="#4575a8"/>
      <stop offset="100%" stop-color="#1b3956"/>
    </linearGradient>
  </defs>
  <rect x="40" y="80" width="320" height="380" fill="url(#watergrad)" stroke="#2b486b"/>

  <!-- Deep reservoir band -->
  <rect x="40" y="460" width="320" height="40" fill="#0e2236" stroke="#2b486b"/>
  <text x="200" y="485" text-anchor="middle" fill="#fff" font-size="13">Deep reservoir: T(-H, t) = T_deep</text>

  <!-- Mooring chain -->
  <line x1="200" y1="80" x2="200" y2="460" stroke="#fff" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Sensors -->
  <g>
    <circle cx="200" cy="120" r="6" fill="#f4d03f" stroke="#333"/>
    <text x="212" y="124" fill="#fff">T(z_1, t)   z_1 = 5 m</text>
    <circle cx="200" cy="180" r="6" fill="#f4d03f" stroke="#333"/>
    <text x="212" y="184" fill="#fff">T(z_2, t)   z_2 = 20 m</text>
    <circle cx="200" cy="260" r="6" fill="#f4d03f" stroke="#333"/>
    <text x="212" y="264" fill="#fff">T(z_3, t)   z_3 = 40 m</text>
    <circle cx="200" cy="340" r="6" fill="#f4d03f" stroke="#333"/>
    <text x="212" y="344" fill="#fff">T(z_4, t)   z_4 = 70 m</text>
    <circle cx="200" cy="420" r="6" fill="#f4d03f" stroke="#333"/>
    <text x="212" y="424" fill="#fff">T(z_5, t)   z_5 = 95 m</text>
  </g>

  <!-- Surface fluxes -->
  <g stroke="#c0392b" stroke-width="2" fill="#c0392b">
    <line x1="80" y1="50" x2="80" y2="78" marker-end="url(#redarrow)"/>
    <line x1="120" y1="78" x2="120" y2="50" marker-end="url(#redarrow)"/>
    <line x1="160" y1="50" x2="160" y2="78" marker-end="url(#redarrow)"/>
    <text x="75" y="40" fill="#c0392b" font-size="11">Q_SW</text>
    <text x="115" y="40" fill="#c0392b" font-size="11">Q_LW</text>
    <text x="148" y="40" fill="#c0392b" font-size="11">Q_lat, Q_sens</text>
  </g>

  <!-- Penetrating shortwave decay (curved arrow inside water) -->
  <path d="M 80 80 Q 95 200 90 320" stroke="#e67e22" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
  <text x="55" y="200" fill="#e67e22" font-size="11" transform="rotate(-90 55 200)">Beer-Lambert decay S(z, t)</text>

  <!-- Vertical advection arrow -->
  <g stroke="#27ae60" stroke-width="3" fill="#27ae60">
    <line x1="320" y1="430" x2="320" y2="170" marker-end="url(#greenarrow)"/>
  </g>
  <text x="328" y="300" fill="#27ae60" font-size="12">w(z, t)</text>
  <text x="328" y="316" fill="#27ae60" font-size="11">vertical advection</text>
  <text x="328" y="332" fill="#27ae60" font-size="11">(upwelling shown)</text>

  <!-- Eddy diffusivity callout -->
  <g stroke="#8e44ad" stroke-width="1" fill="#8e44ad">
    <path d="M 60 110 Q 70 130 60 150 Q 70 170 60 190" stroke-width="2" fill="none"/>
  </g>
  <text x="35" y="135" fill="#8e44ad" font-size="11" transform="rotate(-90 35 135)">kappa(z, t): turbulent diff.</text>

  <!-- Thermocline line -->
  <line x1="40" y1="220" x2="360" y2="220" stroke="#fff" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="42" y="215" fill="#fff" font-size="11">— thermocline —</text>

  <!-- Right-hand annotated panels -->
  <g font-size="12" fill="#222">
    <rect x="395" y="35" width="305" height="125" fill="#fbf7e7" stroke="#caa436"/>
    <text x="405" y="55" font-weight="bold">Column PDE in (z, t)</text>
    <text x="405" y="78">∂T/∂t = -w(z,t) ∂T/∂z</text>
    <text x="405" y="98">       + ∂/∂z [ kappa(z,t) ∂T/∂z ]</text>
    <text x="405" y="118">       + S(z,t)         (penetrating SW)</text>
    <text x="405" y="146" fill="#888" font-size="11">advection + Fickian diffusion + body source</text>

    <rect x="395" y="180" width="305" height="115" fill="#eef7ee" stroke="#3e8e41"/>
    <text x="405" y="200" font-weight="bold">Boundary conditions</text>
    <text x="405" y="222">surface (z = 0):  -rho c_p kappa ∂T/∂z = Q_np(t)</text>
    <text x="405" y="244">deep  (z = -H):  T = T_deep</text>
    <text x="405" y="272" fill="#888" font-size="11">Neumann at top (air-sea flux),</text>
    <text x="405" y="285" fill="#888" font-size="11">Dirichlet at bottom (deep reservoir).</text>

    <rect x="395" y="315" width="305" height="140" fill="#f3eef8" stroke="#7e57c2"/>
    <text x="405" y="335" font-weight="bold">Prescribed forcings (from elsewhere)</text>
    <text x="405" y="358">w(z, t):       2-D shallow-water + continuity</text>
    <text x="405" y="378">kappa(z, t):  KPP / Mellor-Yamada closure</text>
    <text x="405" y="398">Q_np(t):       bulk air-sea formulas</text>
    <text x="405" y="418">Q_SW(t):       observed insolation</text>
    <text x="405" y="442" fill="#888" font-size="11">column inherits these — does not solve for them.</text>
  </g>

  <!-- Depth axis -->
  <g stroke="#222" stroke-width="1" fill="#222">
    <line x1="30" y1="80" x2="30" y2="460" stroke-width="1.5"/>
    <line x1="26" y1="80" x2="30" y2="80"/>
    <line x1="26" y1="460" x2="30" y2="460"/>
    <text x="10" y="84" font-size="11">z = 0</text>
    <text x="2" y="464" font-size="11">z = -H</text>
  </g>

  <!-- Arrow markers -->
  <defs>
    <marker id="redarrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/>
    </marker>
    <marker id="greenarrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#27ae60"/>
    </marker>
  </defs>

  <text x="200" y="525" text-anchor="middle" fill="#444" font-size="11">
    Schematic of the 1-D thermistor column (Unit 8 §8.2). Five sensors at fixed depths sample T(z_k, t) as the column
  </text>
  <text x="200" y="540" text-anchor="middle" fill="#444" font-size="11">
    evolves under advection by w, turbulent diffusion by kappa, surface fluxes, and penetrating shortwave.
  </text>
</svg>
