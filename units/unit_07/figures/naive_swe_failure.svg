<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="Helvetica,Arial,sans-serif" font-size="12">
  <rect width="820" height="420" fill="#ffffff"/>

  <text x="410" y="22" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">
    Naïve PINN on the 1-D linearised SWE — what failure looks like
  </text>

  <!-- ============ Panel A: η(x, t) at t = T_f / 2 ============ -->
  <g>
    <text x="200" y="50" text-anchor="middle" font-weight="bold" fill="#222">η(x, t = T_f/2) — surface elevation along the channel</text>

    <!-- Axes -->
    <line x1="60" y1="180" x2="380" y2="180" stroke="#222" stroke-width="1.3"/>
    <line x1="60" y1="60" x2="60" y2="180" stroke="#222" stroke-width="1.3"/>
    <!-- baseline -->
    <line x1="60" y1="135" x2="380" y2="135" stroke="#bbb" stroke-width="0.5" stroke-dasharray="3 3"/>

    <!-- FD reference curve: an outgoing pair of bumps from a centred Gaussian IC -->
    <path d="M 60 135
             Q 80 135 100 135
             Q 120 135 135 120
             Q 150 90 165 75
             Q 175 70 185 75
             Q 195 90 205 110
             Q 215 130 220 135
             Q 230 135 250 135
             Q 270 130 285 110
             Q 295 90 305 75
             Q 315 70 325 75
             Q 335 90 345 120
             Q 360 135 380 135"
          stroke="#222" stroke-width="2" fill="none"/>
    <text x="385" y="80" fill="#222" font-size="11">FD reference</text>

    <!-- PINN (naive) — too smooth, fails to capture the second bump on the right -->
    <path d="M 60 135
             Q 100 132 140 125
             Q 175 112 200 102
             Q 230 110 270 125
             Q 320 138 380 137"
          stroke="#c0392b" stroke-width="2" stroke-dasharray="6 3" fill="none"/>
    <text x="385" y="105" fill="#c0392b" font-size="11">naïve PINN</text>
    <text x="385" y="118" fill="#c0392b" font-size="10">(over-smoothed)</text>

    <!-- BC misfit highlight: PINN doesn't return cleanly to η=0 at x=L -->
    <circle cx="380" cy="137" r="5" fill="none" stroke="#c0392b" stroke-width="1.5"/>
    <text x="383" y="170" fill="#c0392b" font-size="10" text-anchor="start">BC drift</text>

    <text x="220" y="200" text-anchor="middle" fill="#666" font-size="10">x along channel →</text>
    <text x="50" y="64" text-anchor="end" fill="#666" font-size="10">η ↑</text>
  </g>

  <!-- ============ Panel B: residual-vs-time histogram (causality violation) ============ -->
  <g>
    <text x="610" y="50" text-anchor="middle" font-weight="bold" fill="#222">PDE residual vs t — causality violation signature</text>

    <line x1="460" y1="180" x2="780" y2="180" stroke="#222" stroke-width="1.3"/>
    <line x1="460" y1="60" x2="460" y2="180" stroke="#222" stroke-width="1.3"/>

    <!-- Healthy decay (would-be ideal) -->
    <path d="M 460 75 L 780 165" stroke="#3e8e41" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>

    <!-- Naive PINN — flat or rising residual late in time -->
    <g fill="#c0392b" opacity="0.8">
      <rect x="470" y="155" width="15" height="25"/>
      <rect x="490" y="148" width="15" height="32"/>
      <rect x="510" y="142" width="15" height="38"/>
      <rect x="530" y="135" width="15" height="45"/>
      <rect x="550" y="128" width="15" height="52"/>
      <rect x="570" y="120" width="15" height="60"/>
      <rect x="590" y="112" width="15" height="68"/>
      <rect x="610" y="100" width="15" height="80"/>
      <rect x="630" y="92" width="15" height="88"/>
      <rect x="650" y="86" width="15" height="94"/>
      <rect x="670" y="80" width="15" height="100"/>
      <rect x="690" y="76" width="15" height="104"/>
      <rect x="710" y="70" width="15" height="110"/>
      <rect x="730" y="68" width="15" height="112"/>
      <rect x="750" y="65" width="15" height="115"/>
    </g>
    <text x="620" y="200" text-anchor="middle" fill="#666" font-size="10">t →</text>
    <text x="450" y="64" text-anchor="end" fill="#666" font-size="10">|r|² ↑</text>

    <!-- in-axes legend (top-left, where the plot is empty), white-masked so the
         green reference line behind it doesn't show through -->
    <rect x="462" y="62" width="150" height="32" fill="#ffffff" fill-opacity="0.92" stroke="#e2e2e2" stroke-width="0.6"/>
    <line x1="468" y1="73" x2="486" y2="73" stroke="#3e8e41" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="491" y="77" fill="#3e8e41" font-size="10">ideal — decreasing</text>
    <rect x="468" y="84" width="15" height="8" fill="#c0392b" opacity="0.8"/>
    <text x="491" y="91" fill="#c0392b" font-size="10">naïve PINN — growing</text>
  </g>

  <!-- ============ Bottom: three failure modes summary ============ -->
  <g>
    <rect x="60" y="240" width="230" height="160" fill="#fff3f0" stroke="#c0392b"/>
    <text x="70" y="260" font-weight="bold" fill="#c0392b">1. Loss imbalance</text>
    <text x="70" y="280" font-size="11" fill="#222">PDE loss reaches 10⁻⁶ but the</text>
    <text x="70" y="294" font-size="11" fill="#222">BC misfit stalls at 10⁻¹ — the</text>
    <text x="70" y="308" font-size="11" fill="#222">optimiser zeroes the easy term</text>
    <text x="70" y="322" font-size="11" fill="#222">first.</text>
    <text x="70" y="346" font-size="11" font-style="italic" fill="#666">fix: adaptive loss weighting</text>
    <text x="70" y="360" font-size="11" font-style="italic" fill="#666">      (McClenny &amp; Braga-Neto 2022)</text>
    <text x="70" y="378" font-size="11" font-style="italic" fill="#666">see §7.3</text>

    <rect x="295" y="240" width="230" height="160" fill="#fffaf0" stroke="#e67e22"/>
    <text x="305" y="260" font-weight="bold" fill="#b25800">2. Spectral bias</text>
    <text x="305" y="280" font-size="11" fill="#222">The smooth-MLP ansatz prefers</text>
    <text x="305" y="294" font-size="11" fill="#222">low frequencies; the sharp</text>
    <text x="305" y="308" font-size="11" fill="#222">Gaussian IC bump never quite</text>
    <text x="305" y="322" font-size="11" fill="#222">resolves.</text>
    <text x="305" y="346" font-size="11" font-style="italic" fill="#666">fix: Fourier-feature embedding</text>
    <text x="305" y="360" font-size="11" font-style="italic" fill="#666">      (Tancik et al. 2020)</text>
    <text x="305" y="378" font-size="11" font-style="italic" fill="#666">see §7.3</text>

    <rect x="530" y="240" width="230" height="160" fill="#f0f4ff" stroke="#3a4fa8"/>
    <text x="540" y="260" font-weight="bold" fill="#3a4fa8">3. Causal violation</text>
    <text x="540" y="280" font-size="11" fill="#222">Late-time residuals stay high</text>
    <text x="540" y="294" font-size="11" fill="#222">because nothing in the loss</text>
    <text x="540" y="308" font-size="11" fill="#222">requires t₂ to be a consequence</text>
    <text x="540" y="322" font-size="11" fill="#222">of t₁ &lt; t₂  (panel B above).</text>
    <text x="540" y="346" font-size="11" font-style="italic" fill="#666">fix: causal training</text>
    <text x="540" y="360" font-size="11" font-style="italic" fill="#666">      (Wang et al. 2022)</text>
    <text x="540" y="378" font-size="11" font-style="italic" fill="#666">see §7.3</text>
  </g>
</svg>
