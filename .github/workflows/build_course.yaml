name: Deploy course site

# Light, automatic deploy. Runs on every push to main.
#
# With `freeze: true` in _quarto.yml, `quarto render` reuses the committed
# _freeze/ cache and never executes the Julia code, so this finishes in a
# couple of minutes. The heavy re-execution lives in recompute.yaml, which
# only you trigger.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; newer pushes supersede older ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      # No Julia here on purpose: freeze: true guarantees no code execution.
      # If this step ever tries to execute (e.g. new code added without a
      # recompute), it fails loudly — your cue to run the Recompute action.
      - name: Render site from freeze cache
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
