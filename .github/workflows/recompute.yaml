name: Recompute freeze cache

# Heavy, MANUAL only. You trigger this from the Actions tab when a unit's
# code (or its results) have changed and the published outputs need to be
# regenerated.
#
# It re-executes the chosen unit's Julia code, refreshes that unit's entry in
# the _freeze/ cache, and commits it back to main. That commit then triggers
# the light "Deploy course site" workflow automatically, so the live site
# updates with the fresh results.
#
# Pick a single unit (the normal case) — that fits comfortably inside CI.
# A full "all" recompute is a cold run that can exceed GitHub's 6-hour job
# limit; do that locally with `make recompute` instead.

on:
  workflow_dispatch:
    inputs:
      unit:
        description: 'Which document to re-execute'
        required: true
        type: choice
        default: '01'
        options:
          - index
          - '01'
          - '02'
          - '03'
          - '04'
          - '05'
          - '06'
          - '07'
          - '08'
          - '09'
          - '10'
          - exercise_solutions
          - all

permissions:
  contents: write

jobs:
  recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Julia dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Re-execute and refresh freeze cache
        env:
          GKSwstype: "100"
        run: |
          U="${{ inputs.unit }}"
          if [ "$U" = "all" ]; then
            make recompute
          elif [ "$U" = "index" ]; then
            # Render a single document directly: this always executes,
            # regardless of `freeze: true`, and updates its freeze entry.
            quarto render index.qmd
          elif [ "$U" = "exercise_solutions" ]; then
            quarto render units/exercise_solutions/exercise_solutions.qmd
          else
            quarto render "units/unit_${U}/unit_${U}.qmd"
          fi

      - name: Commit refreshed freeze cache
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _freeze
          if git diff --cached --quiet; then
            echo "Freeze cache unchanged — nothing to commit."
          else
            git commit -m "CI: refresh freeze cache for unit ${{ inputs.unit }}"
            git push
          fi
