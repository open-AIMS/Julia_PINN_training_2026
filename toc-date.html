<script>
document.addEventListener("DOMContentLoaded", function() {
  var toc = document.getElementById("TOC");

  if (toc) {
    // Make TOC title clickable to scroll to top
    var tocTitle = document.getElementById("toc-title");
    if (tocTitle) {
      tocTitle.style.cursor = "pointer";
      tocTitle.addEventListener("click", function() {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }

    // Add last update date
    var dateEl = document.querySelector("p.date");
    if (dateEl) {
      var div = document.createElement("div");
      div.className = "toc-last-updated";
      div.textContent = "Last update: " + dateEl.textContent.trim();
      toc.appendChild(div);
    }

    // Prev/Next nav at the bottom of the TOC (unit pages only)
    var path = location.pathname;
    var match = path.match(/unit_(\d+)\.html$/);
    if (match) {
      var unit = parseInt(match[1]);
      var baseDir = path.replace(/units\/unit_\d+\/unit_\d+\.html$/, "");
      var unitPath = function(u) {
        var s = String(u).padStart(2, "0");
        return baseDir + "units/unit_" + s + "/unit_" + s + ".html";
      };

      var nav = document.createElement("div");
      nav.className = "toc-nav";

      var prevDiv = document.createElement("div");
      prevDiv.className = "toc-nav-prev";
      var nextDiv = document.createElement("div");
      nextDiv.className = "toc-nav-next";

      if (unit > 1) {
        prevDiv.innerHTML = '<a href="' + unitPath(unit - 1) + '">&lt; Previous Unit</a>';
      }

      nav.appendChild(prevDiv);
      nav.appendChild(nextDiv);
      toc.appendChild(nav);

      // Probe for next unit (works on localhost; silently fails on file://)
      fetch(unitPath(unit + 1), { method: "HEAD" }).then(function(r) {
        if (r.ok) {
          nextDiv.innerHTML = '<a href="' + unitPath(unit + 1) + '">Next Unit &gt;</a>';
        }
      }).catch(function() {});
    }
  }

  // Collapsible code blocks: preview first ~3 lines, click to expand
  document.querySelectorAll("div.sourceCode").forEach(function(el) {
    var pre = el.querySelector("pre");
    if (!pre) return;
    // Only collapse blocks taller than ~5em
    if (pre.scrollHeight <= 90) return;
    el.classList.add("code-collapsible");
    el.addEventListener("click", function(e) {
      // Don't toggle if the user is selecting text
      var sel = window.getSelection && window.getSelection();
      if (sel && sel.toString().length > 0) return;

      // When expanded, only collapse from the bottom strip
      if (el.classList.contains("code-expanded")) {
        var rect = el.getBoundingClientRect();
        var yFromBottom = rect.bottom - e.clientY;
        if (yFromBottom > 32) return;
      }

      var rectBefore = el.getBoundingClientRect();
      var offsetBefore = rectBefore.top;
      el.classList.toggle("code-expanded");
      var offsetAfter = el.getBoundingClientRect().top;
      window.scrollBy(0, offsetAfter - offsetBefore);
    });
  });
});
</script>
